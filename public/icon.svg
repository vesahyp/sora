<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The race in one tile, in the game's light: a low sun from the upper
       left, shadows long and hard to the lower right. A worn red rally
       car with its stripes and roof number, dust behind it, on a gravel
       road cut through dry straw with a spruce in the corner. The car
       and its shadow stay inside r=205 of centre, the maskable safe zone,
       so round and squircle launchers never clip it. Full bleed: iOS
       rounds its own corners. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2493a"/>
      <stop offset="0.55" stop-color="#c8352a"/>
      <stop offset="1" stop-color="#8d2219"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#0d0b08" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0b08" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="dust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a98a" stop-opacity="0"/>
      <stop offset="1" stop-color="#b9a98a" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- straw -->
  <rect width="512" height="512" fill="#8e7f55"/>
  <g fill="#6f6640" opacity="0.5">
    <ellipse cx="80" cy="420" rx="70" ry="40"/>
    <ellipse cx="440" cy="90" rx="60" ry="34"/>
    <ellipse cx="470" cy="470" rx="90" ry="50"/>
  </g>
  <g stroke="#a8986a" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M30 60l6 -14M52 92l5 -12M24 150l7 -12M470 420l6 -13M448 456l5 -12M490 380l6 -12M60 480l6 -13M110 500l5 -12"/>
  </g>

  <!-- the road, cut diagonally, with its ditch, berm, gravel, ruts and stones -->
  <g transform="rotate(-38 256 256)">
    <rect x="-200" y="94" width="912" height="324" fill="#45422a"/>
    <rect x="-200" y="112" width="912" height="288" fill="#6c6354"/>
    <rect x="-200" y="126" width="912" height="260" fill="#7f7666"/>
    <rect x="-200" y="236" width="912" height="40" fill="#938a78" opacity="0.6"/>
    <rect x="-200" y="176" width="912" height="14" fill="#5a5245" opacity="0.7"/>
    <rect x="-200" y="322" width="912" height="14" fill="#5a5245" opacity="0.7"/>
    <g fill="#a39a88">
      <rect x="40" y="140" width="7" height="6"/><rect x="120" y="372" width="6" height="5"/>
      <rect x="330" y="150" width="8" height="6"/><rect x="420" y="360" width="6" height="6"/>
      <rect x="-20" y="300" width="6" height="5"/><rect x="480" y="200" width="7" height="6"/>
      <rect x="200" y="380" width="6" height="5"/><rect x="60" y="210" width="5" height="5"/>
    </g>
    <g fill="#5a5245">
      <rect x="90" y="150" width="6" height="5"/><rect x="380" y="368" width="7" height="5"/>
      <rect x="250" y="138" width="5" height="5"/><rect x="-60" y="240" width="6" height="6"/>
    </g>
  </g>

  <!-- spruce in the corner: shadow first, then the crown -->
  <ellipse cx="112" cy="112" rx="78" ry="40" transform="rotate(38 112 112)" fill="#120e16" opacity="0.5"/>
  <g fill="#1b2117">
    <circle cx="66" cy="66" r="52"/>
    <circle cx="36" cy="90" r="32"/>
    <circle cx="96" cy="30" r="30"/>
    <circle cx="100" cy="92" r="28"/>
    <circle cx="40" cy="36" r="30"/>
  </g>
  <circle cx="62" cy="60" r="10" fill="#2f3a24"/>

  <!-- dust behind the car, drifting with the sun -->
  <g transform="translate(256 256) rotate(-38) scale(1.25)">
    <ellipse cx="-150" cy="4" rx="70" ry="38" fill="#b9a98a" opacity="0.22"/>
    <ellipse cx="-120" cy="-6" rx="48" ry="28" fill="#b9a98a" opacity="0.3"/>
    <ellipse cx="-98" cy="6" rx="30" ry="20" fill="#c9b99a" opacity="0.35"/>
  </g>

  <!-- the car's shadow, thrown down the sun in world space -->
  <g transform="translate(292 284) rotate(-38) scale(1.3 1.25)">
    <path d="M-100 -34 L-88 -48 L82 -48 L100 -30 L100 30 L82 48 L-88 48 L-100 34 Z" fill="#120e16" opacity="0.55"/>
  </g>

  <!-- the car, nose to the upper right -->
  <g transform="translate(256 256) rotate(-38) scale(1.25)">
    <!-- wheels and mud flaps, slightly proud of the arches -->
    <g fill="#1a1612">
      <rect x="-80" y="-56" width="34" height="18" rx="3"/><rect x="-80" y="38" width="34" height="18" rx="3"/>
      <rect x="44" y="-56" width="34" height="18" rx="3"/><rect x="44" y="38" width="34" height="18" rx="3"/>
    </g>
    <!-- body: chamfered, arches flared -->
    <path d="M-100 -34 L-88 -48 L-70 -48 L-62 -52 L-32 -52 L-26 -48 L30 -48 L36 -52 L66 -52 L72 -48 L82 -48 L100 -30 L100 30 L82 48 L72 48 L66 52 L36 52 L30 48 L-26 48 L-32 52 L-62 52 L-70 48 L-88 48 L-100 34 Z" fill="url(#body)" stroke="#4a120d" stroke-width="4" stroke-linejoin="round"/>
    <!-- the lit edge toward the sun -->
    <path d="M-88 -46 L-70 -46 L-62 -50 L-32 -50 L-26 -46 L30 -46 L36 -50 L66 -50 L72 -46 L82 -46 L96 -32" fill="none" stroke="#f3d9b4" stroke-width="3" opacity="0.55"/>
    <!-- stripes along the length -->
    <rect x="-98" y="-12" width="196" height="8" fill="#e6dcc4" opacity="0.9"/>
    <rect x="-98" y="4" width="196" height="8" fill="#e6dcc4" opacity="0.9"/>
    <!-- bonnet seam, boot seam -->
    <rect x="42" y="-44" width="3" height="88" fill="#6e1a13" opacity="0.8"/>
    <rect x="-52" y="-44" width="3" height="88" fill="#6e1a13" opacity="0.8"/>
    <!-- glass: windscreen, rear -->
    <path d="M22 -40 L44 -36 L44 36 L22 40 Z" fill="#1d2127"/>
    <path d="M-30 -36 L-50 -40 L-50 40 L-30 36 Z" fill="#1d2127"/>
    <path d="M24 -38 L40 -34 L40 -26 L24 -30 Z" fill="#4d5a66" opacity="0.6"/>
    <!-- roof with the number -->
    <rect x="-30" y="-44" width="52" height="88" fill="#d23d31"/>
    <rect x="-30" y="-12" width="52" height="8" fill="#e6dcc4" opacity="0.9"/>
    <rect x="-30" y="4" width="52" height="8" fill="#e6dcc4" opacity="0.9"/>
    <rect x="-18" y="-24" width="28" height="48" fill="#efe6d2"/>
    <path d="M-10 -16 L2 -16 L2 -10 L-4 16 L-12 16 L-5 -10 L-10 -10 Z" fill="#15120e"/>
    <!-- mud on the sills and arches -->
    <g fill="#4d4130" opacity="0.55">
      <rect x="-86" y="-50" width="40" height="7"/><rect x="-86" y="43" width="40" height="7"/>
      <rect x="40" y="-50" width="36" height="7"/><rect x="40" y="43" width="36" height="7"/>
      <rect x="-98" y="-30" width="8" height="60" opacity="0.6"/>
    </g>
    <!-- a dent and a scrape -->
    <path d="M-72 20 l10 -6 l8 8 l-12 6 z" fill="#8d2219" opacity="0.8"/>
    <path d="M60 -30 l20 4" stroke="#f3d9b4" stroke-width="2" opacity="0.5"/>
    <!-- lights -->
    <rect x="94" y="-30" width="8" height="14" fill="#f5c76a"/>
    <rect x="94" y="16" width="8" height="14" fill="#f5c76a"/>
    <rect x="-102" y="-28" width="6" height="12" fill="#e0301e"/>
    <rect x="-102" y="16" width="6" height="12" fill="#e0301e"/>
  </g>
  <!-- the headlights' glow ahead -->
  <path d="M340 180 L470 70 L510 130 L370 230 Z" fill="#f5d9a0" opacity="0.12"/>

  <!-- the frame's vignette -->
  <rect width="512" height="512" fill="url(#vig)"/>
</svg>
