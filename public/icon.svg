<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The race in one tile: a worn red car on a strip of gravel at dusk,
       its shadow long and hard toward the lower right, on soot. Everything
       important stays inside r=200 of centre so round launcher masks never
       clip it. Full-bleed background: iOS rounds its own corners. -->
  <rect width="512" height="512" fill="#15120e"/>
  <!-- the road: gravel with a darker rut on each side -->
  <g transform="rotate(-32 256 256)">
    <rect x="-80" y="128" width="672" height="256" fill="#4d4130"/>
    <rect x="-80" y="144" width="672" height="224" fill="#7f7666"/>
    <rect x="-80" y="180" width="672" height="12" fill="#4a4337" opacity="0.7"/>
    <rect x="-80" y="320" width="672" height="12" fill="#4a4337" opacity="0.7"/>
  </g>
  <!-- the car: shadow first, offset down the sun, then the body -->
  <g transform="translate(250 250) rotate(-32) scale(1.45)">
    <rect x="-96" y="-38" width="192" height="76" rx="6" fill="#120e16" opacity="0.6" transform="translate(5 30)"/>
    <rect x="-96" y="-38" width="192" height="76" rx="6" fill="#c8352a"/>
    <rect x="-96" y="-38" width="192" height="76" rx="6" fill="none" stroke="#6e1a13" stroke-width="5"/>
    <rect x="-52" y="-30" width="34" height="60" fill="#1c1915"/>
    <rect x="34" y="-30" width="26" height="60" fill="#1c1915"/>
    <rect x="-96" y="-12" width="192" height="8" fill="#e6dcc4" opacity="0.85"/>
    <rect x="-96" y="4" width="192" height="8" fill="#e6dcc4" opacity="0.85"/>
    <rect x="86" y="-32" width="10" height="16" fill="#f0a020"/>
    <rect x="86" y="16" width="10" height="16" fill="#f0a020"/>
  </g>
</svg>
