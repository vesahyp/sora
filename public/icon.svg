<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A gravel road seen from above, bending through the forest, and a
       red car on it. Everything important stays inside r=200 of centre so
       round launcher masks never clip it. Full-bleed background: iOS
       rounds its own corners on the home screen. -->
  <rect width="512" height="512" fill="#4c7a2e"/>
  <g fill="#2b5a2a">
    <circle cx="70" cy="90" r="46"/><circle cx="430" cy="70" r="54"/><circle cx="460" cy="420" r="60"/>
    <circle cx="60" cy="440" r="50"/><circle cx="130" cy="330" r="34"/><circle cx="400" cy="250" r="30"/>
  </g>
  <path d="M-40 180 C 120 160, 200 260, 300 240 S 480 160, 560 220" fill="none" stroke="#8a7a5e" stroke-width="150" stroke-linecap="round"/>
  <path d="M-40 180 C 120 160, 200 260, 300 240 S 480 160, 560 220" fill="none" stroke="#b9a98a" stroke-width="130" stroke-linecap="round"/>
  <path d="M-40 180 C 120 160, 200 260, 300 240 S 480 160, 560 220" fill="none" stroke="#6b5e46" stroke-width="6" stroke-dasharray="1 30" opacity="0.5"/>
  <g transform="translate(256 236) rotate(12)">
    <ellipse cx="4" cy="8" rx="78" ry="38" fill="rgba(0,0,0,0.3)"/>
    <rect x="-74" y="-30" width="148" height="60" rx="16" fill="#c8352a"/>
    <rect x="-42" y="-24" width="34" height="48" rx="5" fill="#1d2a33"/>
    <rect x="24" y="-24" width="30" height="48" rx="5" fill="#1d2a33"/>
    <rect x="-8" y="-26" width="32" height="52" rx="5" fill="#e0493c"/>
    <rect x="68" y="-24" width="8" height="14" fill="#fff3c0"/><rect x="68" y="10" width="8" height="14" fill="#fff3c0"/>
  </g>
</svg>
